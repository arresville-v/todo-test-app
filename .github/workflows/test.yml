name: Combined Test Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-api:
    runs-on: ubuntu-latest
    name: Test API Project
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore TodoApp.Api.Test/TodoApp.Api.Test.csproj
    
    - name: Build API and tests
      run: dotnet build TodoApp.Api.Test/TodoApp.Api.Test.csproj --no-restore --configuration Release
    
    - name: Run API Tests
      run: dotnet test TodoApp.Api.Test/TodoApp.Api.Test.csproj --no-build --configuration Release --verbosity normal
  
  test-web:
    runs-on: ubuntu-latest
    name: Test Angular Web App
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'TodoApp.Web/package-lock.json'
    
    - name: Install dependencies
      run: npm ci
      working-directory: TodoApp.Web
    
    - name: Build Web App
      run: npm run build
      working-directory: TodoApp.Web
    
    - name: Run Web Tests
      run: npm test
      working-directory: TodoApp.Web
  
  all-tests-passed:
    runs-on: ubuntu-latest
    needs: [test-api, test-web]
    name: All Tests Passed
    
    steps:
    - name: Verify all tests passed
      run: echo "All pipeline tests passed successfully! ✓"
