name: Web Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'TodoApp.Web/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'TodoApp.Web/**'

jobs:
  test-web:
    runs-on: ubuntu-latest
    name: Test Angular Web App
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'TodoApp.Web/package-lock.json'
    
    - name: Install dependencies
      run: npm ci
      working-directory: TodoApp.Web
    
    - name: Build Web App
      run: npm run build
      working-directory: TodoApp.Web
    
    - name: Run Web Tests
      run: npm test
      working-directory: TodoApp.Web
    
    - name: Test Results Summary
      if: always()
      run: echo "Web tests completed successfully"
